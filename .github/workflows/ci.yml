name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f README.md
          test -f .env.example
          test -f docs/WORKFLOW_RUNBOOK.md
          test -f docs/HANDOFF_CHECKLIST.md
